services:
  - type: web
    name: nagehan-cem-dugun
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
    disk:
      name: dugun-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
